# Datasource comes from the Testcontainers PostgreSQL container (@ServiceConnection).
app:
  jwt:
    secret: test-secret-must-be-at-least-32-characters-long
  security:
    bcrypt-strength: 4   # fast hashing in tests; production uses 12
  rate-limit:
    enabled: true
    auth:
      capacity: 10
      window: PT1M
    api:
      capacity: 1000
      window: PT1M
  notifications:
    scheduler-enabled: false   # tests drive the queue directly
    channel: log
    backoff-base: PT0S
    backoff-max: PT0S
    max-attempts: 3
  seed:
    demo-accounts: false
logging:
  level:
    com.example.healthcare: WARN
    org.testcontainers: WARN
