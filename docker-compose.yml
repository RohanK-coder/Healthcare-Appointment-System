# Full local stack: PostgreSQL, Spring Boot API, React (nginx) and Mailpit (fake SMTP inbox).
#   docker compose up --build
#   App:        http://localhost:3000
#   API docs:   http://localhost:3000/swagger-ui.html
#   Mail inbox: http://localhost:8025   (reminder emails land here; nothing is really sent)
services:
  postgres:
    image: postgres:16
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: healthcare_appointments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - healthcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_appointments"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: healthcare-mailpit
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    container_name: healthcare-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/healthcare_appointments
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-at-least-32-chars-dev-only}
      FRONTEND_URL: http://localhost:3000,http://localhost:5173
      NOTIFICATION_CHANNEL: email
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CLINIC_ZONE: ${CLINIC_ZONE:-UTC}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: healthcare-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  healthcare_pgdata:
