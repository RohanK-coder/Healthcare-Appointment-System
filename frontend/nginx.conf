server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API, Swagger and health go to the Spring Boot container.
    location ~ ^/(api|swagger-ui|v3/api-docs|actuator)(/|$) {
        proxy_pass http://backend:8080;
        # Same-origin requests must look same-origin to Spring's CORS check: forward the Host
        # with its port, and no X-Forwarded-Proto (Tomcat would then reset the port to 80).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths render index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
